<svg xmlns="http://www.w3.org/2000/svg" width="940" height="570" viewBox="0 0 940 570" role="img">
<title>Plan of the zigzag stairs</title>
<desc>Top-down view of the switchback stairs crossing the carton&#x27;s depth, with landings at each turn.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3d3d3a; font-size: 13px; }
.h { font-size: 15px; font-weight: 600; fill: #2c2c2a; }
.s { fill: #5f5e5a; }
.xs { fill: #5f5e5a; font-size: 11.5px; }
.leader { stroke: #888780; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
.dim { stroke: #888780; stroke-width: 1; fill: none; }
.shell { fill: #e6f1fb; stroke: #185fa5; stroke-width: 1.4; stroke-linejoin: round; }
.mouth { fill: #042c53; }
.ground { fill: #f1efe8; stroke: #b4b2a9; stroke-width: 1; }
.footing { fill: none; stroke: #888780; stroke-width: 1; stroke-dasharray: 5 4; }
.flight { fill: #fac775; fill-opacity: 0.75; stroke: #ba7517; stroke-width: 0.8; }
.landing { fill: #faeeda; stroke: #854f0b; stroke-width: 1; }
.rail { stroke: #888780; stroke-width: 1.4; fill: none; }
.post { stroke: #888780; stroke-width: 1.4; fill: none; }
.door { fill: none; stroke: #854f0b; stroke-width: 1.4; stroke-dasharray: 4 3; }
.milk { fill: none; stroke: #f4f8fc; stroke-linecap: round; }
.milk-edge { fill: none; stroke: #85b7eb; stroke-linecap: round; }
.puddle { fill: #f4f8fc; stroke: #85b7eb; stroke-width: 1; }
.person { stroke: #888780; stroke-width: 1.6; fill: none; stroke-linecap: round; }
</style>
<rect width="940" height="570" fill="#fcfbf8"/>
<rect class="shell" x="63.45" y="74" width="688.76" height="256" />
<rect class="ground" x="190.41" y="74" width="90.98" height="256" fill-opacity="0.6" stroke="none"/>
<line class="leader" x1="190.41" y1="330" x2="190.41" y2="61.2" />
<line class="leader" x1="281.39" y1="330" x2="281.39" y2="61.2" />
<text class="xs" x="184.41" y="51.6" text-anchor="end">bottom panel meets grade</text>
<text class="xs" x="287.39" y="51.6" text-anchor="start">climbing floor meets grade</text>
<polygon class="flight" points="198.49,330 270.49,330 270.49,146 198.49,146" />
<polygon class="flight" points="270.49,146 342.49,146 342.49,258 270.49,258" />
<polygon class="flight" points="342.49,258 414.49,258 414.49,146 342.49,146" />
<polygon class="flight" points="414.49,146 486.49,146 486.49,258 414.49,258" />
<polygon class="flight" points="486.49,258 558.49,258 558.49,146 486.49,146" />
<rect class="landing" x="198.49" y="74" width="144" height="72" />
<text class="h" x="270.49" y="108" text-anchor="middle">Landing</text>
<text class="xs" x="270.49" y="124" text-anchor="middle">4 ft up</text>
<rect class="landing" x="270.49" y="258" width="144" height="72" />
<text class="h" x="342.49" y="292" text-anchor="middle">Landing</text>
<text class="xs" x="342.49" y="308" text-anchor="middle">8 ft up</text>
<rect class="landing" x="342.49" y="74" width="144" height="72" />
<text class="h" x="414.49" y="108" text-anchor="middle">Landing</text>
<text class="xs" x="414.49" y="124" text-anchor="middle">12 ft up</text>
<rect class="landing" x="414.49" y="258" width="144" height="72" />
<text class="h" x="486.49" y="292" text-anchor="middle">Landing</text>
<text class="xs" x="486.49" y="308" text-anchor="middle">16 ft up</text>
<rect class="landing" x="486.49" y="74" width="220.27" height="72" />
<text class="h" x="596.62" y="108" text-anchor="middle">Launch deck</text>
<text class="xs" x="596.62" y="124" text-anchor="middle">20 ft up</text>
<rect class="landing" x="634.76" y="146" width="72" height="92" />
<line class="dim" x1="234.49" y1="330" x2="234.49" y2="146" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="xs" x="242.49" y="234" text-anchor="start">19°</text>
<line class="dim" x1="306.49" y1="146" x2="306.49" y2="258" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="xs" x="314.49" y="198" text-anchor="start">30°</text>
<line class="dim" x1="378.49" y1="258" x2="378.49" y2="146" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="xs" x="386.49" y="198" text-anchor="start">30°</text>
<line class="dim" x1="450.49" y1="146" x2="450.49" y2="258" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="xs" x="458.49" y="198" text-anchor="start">30°</text>
<line class="dim" x1="522.49" y1="258" x2="522.49" y2="146" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="xs" x="530.49" y="198" text-anchor="start">27°</text>
<line class="dim" x1="234.49" y1="370" x2="234.49" y2="333" marker-end="url(#arrow)"/>
<text class="s" x="234.49" y="386" text-anchor="middle">Entry door (front face)</text>
<polygon class="mouth" points="712.76,190 712.76,214 728.76,202" />
<text class="s" x="706.76" y="180" text-anchor="start">Spout and slide</text>
<line class="dim" x1="812.21" y1="330" x2="812.21" y2="74" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="h" x="820.21" y="206" text-anchor="start">16 ft deep</text>
<rect class="flight" x="60" y="425" width="16" height="16" />
<text class="s" x="84" y="438" text-anchor="start">Flight, 4.5 ft clear, two-way (number = pitch)</text>
<rect class="landing" x="420" y="425" width="16" height="16" />
<text class="s" x="444" y="438" text-anchor="start">Landing, 4.5 ft deep, railed</text>
<text class="s" x="60" y="467" text-anchor="start">5 flights, a landing every 4 ft of climb, longest fall 4 ft, launch deck 19.6 ft up.</text>
<text class="s" x="60" y="489" text-anchor="start">All checks pass.</text>
</svg>
