<svg xmlns="http://www.w3.org/2000/svg" width="2109" height="538" viewBox="0 0 2109 538" role="img">
<title>Plan of the spiral stairs</title>
<desc>Top-down view of the upright carton: stairs around the four inside walls with landings at the turns.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3d3d3a; font-size: 13px; }
.h { font-size: 15px; font-weight: 600; fill: #2c2c2a; }
.s { fill: #5f5e5a; }
.xs { fill: #5f5e5a; font-size: 11.5px; }
.leader { stroke: #888780; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
.dim { stroke: #888780; stroke-width: 1; fill: none; }
.shell { fill: #e6f1fb; stroke: #185fa5; stroke-width: 1.4; stroke-linejoin: round; }
.mouth { fill: #042c53; }
.ground { fill: #f1efe8; stroke: #b4b2a9; stroke-width: 1; }
.footing { fill: none; stroke: #888780; stroke-width: 1; stroke-dasharray: 5 4; }
.flight { fill: #fac775; fill-opacity: 0.75; stroke: #ba7517; stroke-width: 0.8; }
.landing { fill: #faeeda; stroke: #854f0b; stroke-width: 1; }
.rail { stroke: #888780; stroke-width: 1.4; fill: none; }
.post { stroke: #888780; stroke-width: 1.4; fill: none; }
.door { fill: none; stroke: #854f0b; stroke-width: 1.4; stroke-dasharray: 4 3; }
.milk { fill: none; stroke: #f4f8fc; stroke-linecap: round; }
.milk-edge { fill: none; stroke: #85b7eb; stroke-linecap: round; }
.puddle { fill: #f4f8fc; stroke: #85b7eb; stroke-width: 1; }
.person { stroke: #888780; stroke-width: 1.6; fill: none; stroke-linecap: round; }
</style>
<rect width="2109" height="538" fill="#fcfbf8"/>
<polyline class="milk-edge" points="479.5,161.25 959.59,161.25" style="stroke-width:57.0"/>
<polyline class="milk" points="479.5,161.25 959.59,161.25" style="stroke-width:54.0"/>
<circle class="post" cx="570.96" cy="161.25" r="3" />
<circle class="post" cx="670.29" cy="161.25" r="3" />
<circle class="post" cx="762.89" cy="161.25" r="3" />
<ellipse class="puddle" cx="989.6" cy="161.3" rx="120.0" ry="75.0"/>
<text class="s" x="989.59" y="252.25" text-anchor="middle">Puddle</text>
<text class="s" x="719.55" y="128.25" text-anchor="middle">Slide, 32 ft</text>
<rect class="shell" x="100" y="120" width="379.5" height="283.5" />
<polygon class="shell" points="349,261.75 479.5,403.5 551.5,261.75 479.5,120" style="fill:#cfe1f4"/>
<line class="dim" x1="349" y1="261.75" x2="412" y2="403.5" stroke-dasharray="5 4" style="stroke:#185fa5"/>
<line class="dim" x1="349" y1="261.75" x2="412" y2="120" stroke-dasharray="5 4" style="stroke:#185fa5"/>
<line class="rail" x1="100" y1="261.75" x2="349" y2="261.75" style="stroke:#185fa5;stroke-width:3"/>
<rect class="flight" x="175" y="328.5" width="81" height="67.5" />
<rect class="flight" x="323.5" y="328.5" width="81" height="67.5" />
<rect class="flight" x="404.5" y="195" width="67.5" height="133.5" />
<rect class="flight" x="323.5" y="127.5" width="81" height="67.5" />
<rect class="flight" x="175" y="127.5" width="81" height="67.5" />
<rect class="flight" x="107.5" y="195" width="67.5" height="133.5" />
<rect class="landing" x="107.5" y="328.5" width="67.5" height="67.5" />
<text class="xs" x="141.25" y="356.25" text-anchor="middle">Entry</text>
<text class="xs" x="141.25" y="371.25" text-anchor="middle">0.0 / 24.0 ft</text>
<rect class="landing" x="256" y="328.5" width="67.5" height="67.5" />
<text class="xs" x="289.75" y="356.25" text-anchor="middle">Landing</text>
<text class="xs" x="289.75" y="371.25" text-anchor="middle">3.3 ft</text>
<rect class="landing" x="404.5" y="328.5" width="67.5" height="67.5" />
<text class="xs" x="438.25" y="356.25" text-anchor="middle">Landing</text>
<text class="xs" x="438.25" y="371.25" text-anchor="middle">6.6 ft</text>
<rect class="landing" x="404.5" y="127.5" width="67.5" height="67.5" />
<text class="xs" x="438.25" y="155.25" text-anchor="middle">Landing</text>
<text class="xs" x="438.25" y="170.25" text-anchor="middle">12.0 ft</text>
<rect class="landing" x="256" y="127.5" width="67.5" height="67.5" />
<text class="xs" x="289.75" y="155.25" text-anchor="middle">Landing</text>
<text class="xs" x="289.75" y="170.25" text-anchor="middle">15.3 ft</text>
<rect class="landing" x="107.5" y="127.5" width="67.5" height="67.5" />
<text class="xs" x="141.25" y="155.25" text-anchor="middle">Landing</text>
<text class="xs" x="141.25" y="170.25" text-anchor="middle">18.6 ft</text>
<line class="dim" x1="191.2" y1="362.25" x2="239.8" y2="362.25" marker-end="url(#arrow)"/>
<line class="dim" x1="339.7" y1="362.25" x2="388.3" y2="362.25" marker-end="url(#arrow)"/>
<line class="dim" x1="438.25" y1="301.8" x2="438.25" y2="221.7" marker-end="url(#arrow)"/>
<line class="dim" x1="388.3" y1="161.25" x2="339.7" y2="161.25" marker-end="url(#arrow)"/>
<line class="dim" x1="239.8" y1="161.25" x2="191.2" y2="161.25" marker-end="url(#arrow)"/>
<line class="dim" x1="141.25" y1="221.7" x2="141.25" y2="301.8" marker-end="url(#arrow)"/>
<polygon class="mouth" points="354.25,261.75 478,398.25 546.25,261.75 478,125.25" style="fill-opacity:0.3"/>
<text class="xs" x="465.25" y="257.75" text-anchor="middle">Opening,</text>
<text class="xs" x="465.25" y="271.75" text-anchor="middle">open to sky</text>
<rect class="ground" x="175" y="195" width="229.5" height="133.5" style="fill:#ffffff;stroke-dasharray:4 3"/>
<text class="xs" x="244.75" y="257.75" text-anchor="middle">Open well 15 x 9 ft</text>
<text class="xs" x="244.75" y="271.75" text-anchor="middle">netted at every lap</text>
<line class="dim" x1="141.25" y1="437.5" x2="141.25" y2="406.5" marker-end="url(#arrow)"/>
<text class="s" x="141.25" y="451.5" text-anchor="middle">Door</text>
<text class="xs" x="485.5" y="200.25" text-anchor="start">Tear in the end wall at 12.0 ft</text>
<text class="s" x="289.75" y="112" text-anchor="middle">25.3 ft</text>
<text class="s" x="92" y="261.75" text-anchor="end">18.9 ft</text>
<text class="h" x="1209.59" y="70" text-anchor="start">Spiral stairs</text>
<text class="s" x="1209.59" y="90" text-anchor="start">4.5 ft clear, two-way, 31°</text>
<text class="s" x="1209.59" y="110" text-anchor="start">6 flights, longest 8.9 ft;</text>
<text class="s" x="1209.59" y="130" text-anchor="start">long walls have a mid-wall landing</text>
<text class="s" x="1209.59" y="150" text-anchor="start">Longest fall 5.4 ft (flight to landing)</text>
<text class="s" x="1209.59" y="170" text-anchor="start">Eave deck (lookout) at 24 ft</text>
<text class="s" x="1209.59" y="190" text-anchor="start"></text>
<text class="h" x="1209.59" y="210" text-anchor="start">Slide</text>
<text class="s" x="1209.59" y="230" text-anchor="start">Out of a tear in the spout-end wall</text>
<text class="s" x="1209.59" y="250" text-anchor="start">at the 12.0 ft landing</text>
<text class="s" x="1209.59" y="270" text-anchor="start">About 32 ft long, steepest 30°</text>
<text class="s" x="1209.59" y="290" text-anchor="start"></text>
<text class="h" x="1209.59" y="310" text-anchor="start">Spout</text>
<text class="s" x="1209.59" y="330" text-anchor="start">Open for the look; tip 41.4 ft</text>
<text class="s" x="1209.59" y="360" text-anchor="start">All checks pass.</text>
</svg>
