[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milk-carton"
version = "0.1.0"
description = "Parametric schematics for the BM Milk Carton art project"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
png = ["cairosvg"]
dev = ["pytest", "cairosvg"]

[project.scripts]
milk-carton = "milk_carton.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
