name: Build schematics

# Runs the tests, redraws the schematics from config/ and src/, and commits the
# updated drawings back to main. Fails the run if the stair checks fail, so a bad
# change to the config is flagged without losing the drawings.

on:
  push:
    branches: [main]
    paths: ["src/**", "config/**", "tests/**", "pyproject.toml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Redraw schematics
        id: gen
        run: |
          set +e
          milk-carton --config config/default.json --png --out outputs
          echo "status=$?" >> "$GITHUB_OUTPUT"
          milk-carton --config config/tipped.json --png --sweep --out outputs/tipped || true
      - uses: actions/upload-artifact@v4
        with:
          name: schematics
          path: outputs/
      - name: Build the Claude skill
        run: python scripts/build_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: skill
          path: dist/milk-carton-schematics.skill
      - name: Commit updated drawings
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs
          git diff --cached --quiet || (git commit -m "Regenerate schematics [skip ci]" && git push)
      - name: Fail if the stair checks failed
        if: steps.gen.outputs.status != '0'
        run: |
          echo "Stair checks failed. See outputs/report.md."
          exit 1
